<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox → Action | AI Task Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        base: '#050505',
                        surface: '#111111',
                        accent: '#ffffff',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* The subtle grid pattern */
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
        }

        /* The glowing stars/orbs */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
        }
        
        /* Glassmorphism card */
        .glass-card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Motion layer */
        @keyframes screenReveal {
            from { opacity: 0; transform: translateY(22px) scale(.985); filter: blur(7px); }
            to   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }
        @keyframes softRise {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes glowPulse {
            0%, 100% { opacity: .45; transform: scale(1); }
            50%      { opacity: .9; transform: scale(1.12); }
        }
        @keyframes iconFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50%      { transform: translateY(-7px) rotate(-4deg); }
        }
        
        .screen-enter { animation: screenReveal .75s cubic-bezier(.2,.75,.25,1) both; }
        #login-screen > .glass-card { animation: screenReveal .8s cubic-bezier(.2,.75,.25,1) both; }
        #dashboard-screen > header { animation: softRise .65s .08s both; }
        #dashboard-screen .glass-card { transition: transform .35s cubic-bezier(.2,.8,.2,1), border-color .35s ease, box-shadow .35s ease; }
        #dashboard-screen .glass-card:hover { transform: translateY(-5px); }
        #dashboard-screen .hero-glow { animation: glowPulse 5s ease-in-out infinite; }
        #dashboard-screen .hero-icon { animation: iconFloat 4s ease-in-out infinite; }
        
        #process-btn { transition: transform .25s ease, box-shadow .25s ease, opacity .25s ease; }
        #process-btn:hover:not(:disabled) { transform: translateY(-3px); }
        #process-btn:active:not(:disabled) { transform: translateY(0) scale(.98); }
        #process-btn:disabled { cursor: wait; }
        
        .bg-grid { animation: softRise 1.4s ease both; }
        .glow-orb { animation: glowPulse 9s ease-in-out infinite; }
        .glow-orb:nth-of-type(2) { animation-delay: 2s; }


        /* Warm orange ambient lighting inspired by the reference video */
        .ambient-orange {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
            isolation: isolate;
        }
        .ambient-orange::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(255, 105, 25, .15), transparent 42%),
                radial-gradient(ellipse at 0% 50%, rgba(255, 75, 0, .12), transparent 35%),
                radial-gradient(ellipse at 100% 55%, rgba(255, 115, 25, .13), transparent 36%),
                radial-gradient(ellipse at 50% 100%, rgba(255, 75, 0, .16), transparent 43%);
            filter: blur(22px);
            animation: orangeBreath 8s ease-in-out infinite alternate;
        }
        .ambient-orange::after {
            content: "";
            position: absolute;
            inset: 7px;
            border: 1px solid rgba(255, 112, 38, .13);
            border-radius: 18px;
            box-shadow:
                inset 0 0 28px rgba(255, 91, 15, .10),
                0 0 24px rgba(255, 91, 15, .12),
                0 0 70px rgba(255, 91, 15, .08);
            animation: orangeFramePulse 6s ease-in-out infinite;
        }
        @keyframes orangeBreath {
            0% { opacity: .55; transform: scale(.98); }
            100% { opacity: 1; transform: scale(1.025); }
        }
        @keyframes orangeFramePulse {
            0%, 100% { opacity: .55; box-shadow: inset 0 0 22px rgba(255,91,15,.07), 0 0 18px rgba(255,91,15,.08); }
            50% { opacity: 1; box-shadow: inset 0 0 38px rgba(255,91,15,.14), 0 0 34px rgba(255,91,15,.17), 0 0 80px rgba(255,91,15,.08); }
        }
        @keyframes orangeLightSweep {
            0% { transform: translateX(-130%) rotate(-18deg); opacity: 0; }
            18% { opacity: .65; }
            55% { opacity: .35; }
            100% { transform: translateX(230%) rotate(-18deg); opacity: 0; }
        }
        .orange-sweep {
            position: absolute;
            width: 42%;
            height: 150%;
            top: -25%;
            left: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 111, 32, .08), rgba(255, 142, 56, .18), transparent);
            filter: blur(28px);
            transform: rotate(-18deg);
            animation: orangeLightSweep 12s ease-in-out infinite;
            pointer-events: none;
        }
        #dashboard-screen .hero-glow {
            background: radial-gradient(ellipse at center, rgba(255, 103, 28, .34) 0%, rgba(255, 72, 0, .13) 42%, transparent 72%);
            filter: blur(42px);
        }
        #dashboard-screen .glass-card {
            box-shadow: 0 4px 30px rgba(0,0,0,.5), 0 0 0 rgba(255,100,25,0);
        }
        #dashboard-screen .glass-card:hover {
            border-color: rgba(255, 130, 65, .28);
            box-shadow: 0 10px 36px rgba(0,0,0,.55), 0 0 28px rgba(255,90,20,.09);
        }
        #process-btn {
            box-shadow: 0 0 18px rgba(255, 104, 30, .22), 0 0 42px rgba(255, 75, 0, .08);
        }
        #process-btn:hover:not(:disabled) {
            box-shadow: 0 0 24px rgba(255, 119, 45, .42), 0 0 55px rgba(255, 75, 0, .16);
        }
        #login-screen .glass-card {
            box-shadow: 0 4px 30px rgba(0,0,0,.5), 0 0 55px rgba(255,85,20,.09);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body class="min-h-screen relative font-sans antialiased">

    <!-- Animated orange edge lighting -->
    <div class="ambient-orange" aria-hidden="true"><div class="orange-sweep"></div></div>

    <!-- Background Effects -->
    <div class="fixed inset-0 bg-grid pointer-events-none"></div>
    <div class="glow-orb w-96 h-96 bg-white/5 top-[-10%] left-[-10%]"></div>
    <div class="glow-orb w-[500px] h-[500px] bg-white/5 bottom-[-20%] right-[-10%]"></div>

    <!-- LOGIN / SIGNUP SCREEN -->
    <div id="login-screen" class="flex flex-col items-center justify-center min-h-screen hidden px-4 relative z-10">
        <div class="glass-card p-10 rounded-3xl w-full max-w-md relative overflow-hidden">
            <!-- Inner glow -->
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-1 bg-gradient-to-r from-transparent via-white/40 to-transparent"></div>

            <div class="flex justify-center mb-8">
                <div class="p-3 bg-white/5 rounded-2xl border border-white/10">
                    <i data-lucide="mail" class="w-8 h-8 text-white"></i>
                </div>
            </div>
            
            <h1 class="text-3xl font-bold text-center tracking-tight mb-2">Inbox to Action</h1>
            <p class="text-gray-400 text-center mb-8 text-sm" id="auth-subtitle">Welcome back. Please sign in.</p>
            
            <div id="error-msg" class="bg-red-500/10 border border-red-500/20 text-red-400 p-3 rounded-xl mb-6 text-sm text-center hidden"></div>
            <div id="success-msg" class="bg-green-500/10 border border-green-500/20 text-green-400 p-3 rounded-xl mb-6 text-sm text-center hidden"></div>
            
            <!-- LOGIN FORM -->
            <form id="login-form" class="space-y-4">
                <div>
                    <input type="email" id="login-email" placeholder="name@company.com" required class="w-full bg-black/50 border border-white/10 rounded-xl p-3.5 text-white placeholder-gray-500 focus:outline-none focus:border-white/30 focus:ring-1 focus:ring-white/30 transition text-sm">
                </div>
                <div>
                    <input type="password" id="login-password" placeholder="Password" required class="w-full bg-black/50 border border-white/10 rounded-xl p-3.5 text-white placeholder-gray-500 focus:outline-none focus:border-white/30 focus:ring-1 focus:ring-white/30 transition text-sm">
                </div>
                <button type="submit" class="w-full bg-white text-black font-semibold py-3.5 rounded-xl hover:bg-gray-200 transition-all duration-300 mt-2">
                    Sign In
                </button>
                <p class="text-center text-sm text-gray-400 mt-4">
                    Don't have an account? <a href="#" onclick="toggleAuthMode('signup')" class="text-white hover:underline">Sign up</a>
                </p>
            </form>

            <!-- SIGNUP FORM (Hidden by default) -->
            <form id="signup-form" class="space-y-4 hidden">
                <div>
                    <input type="email" id="signup-email" placeholder="name@company.com" required class="w-full bg-black/50 border border-white/10 rounded-xl p-3.5 text-white placeholder-gray-500 focus:outline-none focus:border-white/30 focus:ring-1 focus:ring-white/30 transition text-sm">
                </div>
                <div>
                    <input type="password" id="signup-password" placeholder="Create a password (min 6 chars)" required class="w-full bg-black/50 border border-white/10 rounded-xl p-3.5 text-white placeholder-gray-500 focus:outline-none focus:border-white/30 focus:ring-1 focus:ring-white/30 transition text-sm">
                </div>
                <button type="submit" class="w-full bg-white text-black font-semibold py-3.5 rounded-xl hover:bg-gray-200 transition-all duration-300 mt-2">
                    Create Account
                </button>
                <p class="text-center text-sm text-gray-400 mt-4">
                    Already have an account? <a href="#" onclick="toggleAuthMode('login')" class="text-white hover:underline">Sign in</a>
                </p>
            </form>
        </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboard-screen" class="hidden p-6 md:p-12 max-w-6xl mx-auto relative z-10">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-16 border-b border-white/10 pb-6">
            <div class="flex items-center gap-3">
                <i data-lucide="mail" class="w-6 h-6 text-white hero-icon"></i>
                <span class="text-xl font-bold tracking-tight">Inbox<span class="text-gray-500">Action</span></span>
            </div>
            <div class="flex items-center gap-6">
                <!-- Changed from <a> to <button> to send the token -->
                <button onclick="connectGmail()" class="flex items-center gap-2 text-sm text-gray-300 hover:text-white transition">
                    <i data-lucide="link" class="w-4 h-4"></i> Connect Gmail
                </button>
                <button onclick="logout()" class="flex items-center gap-2 text-sm text-gray-500 hover:text-white transition">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Log out
                </button>
            </div>
        </header>

        <!-- Hero Action Section -->
        <div class="glass-card p-8 md:p-12 rounded-3xl mb-12 flex flex-col md:flex-row justify-between items-start md:items-center gap-8 relative overflow-hidden">
            <div class="hero-glow absolute top-0 right-0 w-64 h-64 bg-white/5 blur-[80px] rounded-full pointer-events-none"></div>
            
            <div class="relative z-10">
                <h2 class="text-3xl md:text-4xl font-bold tracking-tight mb-3">Ready to clear your inbox?</h2>
                <p class="text-gray-400 max-w-lg">Our AI agent will read your recent emails, extract actionable tasks, and organize them for you automatically.</p>
            </div>
            <button id="process-btn" onclick="processInbox()" class="relative z-10 bg-white text-black font-semibold py-4 px-8 rounded-xl hover:bg-gray-200 transition-all flex items-center gap-2 shadow-[0_0_20px_rgba(255,255,255,0.3)] hover:shadow-[0_0_30px_rgba(255,255,255,0.5)]">
                <i data-lucide="zap" class="w-5 h-5"></i>
                Process Inbox
            </button>
        </div>

        <!-- Task List -->
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-bold tracking-tight">Your Tasks</h2>
            <span id="task-count" class="text-sm text-gray-500 bg-white/5 px-3 py-1 rounded-full border border-white/10">0 pending</span>
        </div>
        
        <div id="task-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Tasks will be injected here -->
        </div>
    </div>

    <!-- Initialize Icons -->
    <script>
        lucide.createIcons();
    </script>

    <script>
        // Use window.location.origin so it works both locally (localhost:8000) and in the cloud (inbox-to-action.fly.dev)
        const API = window.location.origin; 
        let token = localStorage.getItem('token');

        if (token) {
            showDashboard();
        } else {
            document.getElementById('login-screen').classList.remove('hidden');
        }

        // --- TOGGLE LOGIN/SIGNUP UI ---
        function toggleAuthMode(mode) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const subtitle = document.getElementById('auth-subtitle');
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');
            
            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');

            if (mode === 'signup') {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                subtitle.textContent = "Create an account to get started.";
            } else {
                signupForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
                subtitle.textContent = "Welcome back. Please sign in.";
            }
        }

        // --- HANDLE LOGIN ---
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                const res = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    token = data.access_token;
                    localStorage.setItem('token', token);
                    showDashboard();
                } else {
                    errorMsg.textContent = data.detail || 'Login failed';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = 'Network error';
                errorMsg.classList.remove('hidden');
            }
        });

        // --- HANDLE SIGNUP ---
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');

            try {
                const res = await fetch(`${API}/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    if (data.access_token) {
                        token = data.access_token;
                        localStorage.setItem('token', token);
                        showDashboard();
                    } else {
                        successMsg.textContent = "Account created! Please check your email to verify, then sign in.";
                        successMsg.classList.remove('hidden');
                        toggleAuthMode('login');
                    }
                } else {
                    errorMsg.textContent = data.detail || 'Signup failed';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = 'Network error';
                errorMsg.classList.remove('hidden');
            }
        });

        function showDashboard() {
            document.getElementById('login-screen').classList.add('hidden');
            const dashboard = document.getElementById('dashboard-screen');
            dashboard.classList.remove('hidden');
            dashboard.classList.remove('screen-enter');
            void dashboard.offsetWidth; // Trigger reflow for animation
            dashboard.classList.add('screen-enter');
            fetchTasks();
        }

        function logout() {
            localStorage.removeItem('token');
            token = null;
            location.reload();
        }

        // --- NEW: HANDLE GMAIL CONNECTION ---
        async function connectGmail() {
            try {
                const res = await fetch(`${API}/auth/gmail/start`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    const data = await res.json();
                    // Redirect the user to Google's consent screen
                    window.location.href = data.url; 
                } else {
                    alert("Your session has expired. Please log in again.");
                    logout();
                }
            } catch (err) {
                console.error("Failed to start Gmail auth", err);
            }
        }

        async function fetchTasks() {
            try {
                const res = await fetch(`${API}/api/actions`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const tasks = await res.json();
                    renderTasks(tasks);
                } else if (res.status === 401) {
                    logout();
                }
            } catch (err) { console.error(err); }
        }

        async function processInbox() {
            const btn = document.getElementById('process-btn');
            const originalHtml = btn.innerHTML;
            
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Processing...`;
            lucide.createIcons();
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            
            try {
                const res = await fetch(`${API}/api/process-inbox`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    await fetchTasks();
                }
            } catch (err) { console.error(err); }
            
            btn.innerHTML = originalHtml;
            lucide.createIcons();
            btn.disabled = false;
            btn.classList.remove('opacity-80', 'cursor-not-allowed');
        }

        function renderTasks(tasks) {
            const list = document.getElementById('task-list');
            const count = document.getElementById('task-count');
            list.innerHTML = '';
            
            const activeTasks = tasks.filter(t => t.status !== 'completed');
            count.textContent = `${activeTasks.length} pending`;

            if (activeTasks.length === 0) {
                list.innerHTML = `
                    <div class="col-span-full py-16 flex flex-col items-center justify-center border border-dashed border-white/10 rounded-2xl bg-white/[0.02]">
                        <div class="p-4 bg-white/5 rounded-full mb-4">
                            <i data-lucide="check-circle-2" class="w-8 h-8 text-green-500"></i>
                        </div>
                        <p class="text-gray-400 text-sm">You're all caught up!</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            activeTasks.forEach((task, index) => {
                const date = task.due_date ? task.due_date.split('T')[0] : 'No date';
                
                let priorityBadge = '';
                if (task.priority === 'high') {
                    priorityBadge = `<span class="text-[10px] font-bold uppercase tracking-wider text-red-400 bg-red-400/10 px-2.5 py-1 rounded-md border border-red-400/20">High Priority</span>`;
                } else if (task.priority === 'medium') {
                    priorityBadge = `<span class="text-[10px] font-bold uppercase tracking-wider text-yellow-400 bg-yellow-400/10 px-2.5 py-1 rounded-md border border-yellow-400/20">Medium</span>`;
                } else {
                    priorityBadge = `<span class="text-[10px] font-bold uppercase tracking-wider text-gray-400 bg-gray-400/10 px-2.5 py-1 rounded-md border border-gray-400/20">Low</span>`;
                }

                const el = document.createElement('div');
                el.className = "glass-card p-6 rounded-2xl group cursor-pointer transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_8px_30px_rgba(255,255,255,0.05)]";
                el.style.animation = 'softRise .55s cubic-bezier(.2,.75,.25,1) both';
                el.style.animationDelay = `${Math.min(index * 75, 450)}ms`;
                
                el.onclick = () => completeTask(task.id, el);
                
                el.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="p-2.5 bg-white/5 rounded-xl border border-white/10 group-hover:bg-white/10 transition">
                            <i data-lucide="check-square" class="w-5 h-5 text-gray-300 group-hover:text-white transition"></i>
                        </div>
                        ${priorityBadge}
                    </div>
                    <h3 class="font-semibold text-lg text-white mb-2 leading-tight">${task.title}</h3>
                    <p class="text-gray-400 text-sm line-clamp-2 mb-6">${task.description}</p>
                    <div class="flex items-center gap-2 text-xs text-gray-500">
                        <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                        <span>${date}</span>
                    </div>
                `;
                list.appendChild(el);
            });
            
            lucide.createIcons();
        }

        async function completeTask(taskId, element) {
            element.style.transform = 'scale(0.95)';
            element.style.opacity = '0';
            
            setTimeout(() => {
                element.remove();
            }, 300);

            try {
                const res = await fetch(`${API}/api/actions/${taskId}/complete`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!res.ok) {
                    fetchTasks();
                } else {
                    const count = document.getElementById('task-count');
                    let currentCount = parseInt(count.textContent);
                    if (currentCount > 0) count.textContent = `${currentCount - 1} pending`;
                }
            } catch (err) {
                console.error("Failed to complete task", err);
                fetchTasks();
            }
        }
    </script>
</body>
</html>
